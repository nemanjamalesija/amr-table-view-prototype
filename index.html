<style>
/* The prototype's own parts. Every colour comes from amr-web's tokens in emasys.css,
   except the heat scale and the profile greys, which have no token yet. */
:root {
    color-scheme: light;
    --heat-low: #63be7b;
    --heat-mid: #ffeb84;
    --heat-high: #f8696b;
    /* Profile shading, light to dark for low, transitional and high use */
    --profile-low: #ffffff;
    --profile-mid: #e6e6e6;
    --profile-high: #c8c8c8;
    --sidebar: #243a4f;
}
html, body { background: var(--sidebar); }
body {
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: var(--font-size-body);
    color: var(--color-gray-700);
}
#page-wrapper { min-height: 100vh; }
a { cursor: pointer; }
.profile-element .font-bold { color: var(--color-white); }
.legal-links a { margin-left: var(--space-4); text-decoration: underline; }

/* Settings card: one row of fields, the shape of the alarms filter row */
.settings-grid {
    display: grid;
    grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(90px, 0.6fr) auto auto;
    gap: 20px;
    align-items: end;
}
.settings-grid .form-group { margin-bottom: 0; position: relative; }
.switch-field { height: var(--control-height); display: flex; align-items: center; }
.field-hint { position: absolute; top: 100%; left: 0; margin-top: var(--space-1); font-size: var(--font-size-caption); }
.settings-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }
@media (max-width: 1399px) { .settings-grid { grid-template-columns: minmax(200px, 2fr) minmax(140px, 1fr) minmax(90px, 0.6fr) auto; } .settings-actions { grid-column: 1 / -1; } }
@media (max-width: 575px) { .settings-grid { grid-template-columns: 1fr; } }
@media (max-width: 575px) { .settings-grid { grid-template-columns: 1fr; } }
.settings-card .ibox-content { padding-bottom: 28px; }

/* Toggle switch, copied from web/src/components/toggle-switch */
.toggle-switch { position: relative; display: inline-block; width: 40px; height: 20px; padding: 0; border: 0;
    border-radius: var(--radius-pill); background: var(--color-gray-400); cursor: pointer; transition: background 0.2s ease; vertical-align: middle; }
.toggle-switch--on { background: var(--color-primary); }
.toggle-switch:focus-visible { outline: var(--border-width-thick) solid var(--color-primary); outline-offset: var(--space-0-5); }
.toggle-switch__knob { position: absolute; top: var(--space-0-5); left: var(--space-0-5); width: 16px; height: 16px;
    border-radius: 50%; background: var(--color-white); transition: transform 0.2s ease; }
.toggle-switch--on .toggle-switch__knob { transform: translateX(20px); }

/* Month picker: amr-web has none yet */
.month-picker { position: relative; }
.month-picker__button { display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; background: var(--color-white); }
.month-picker__button i { color: var(--color-gray-500); }
.month-picker__panel { position: absolute; z-index: 30; top: calc(100% + var(--space-1)); left: 0; width: 240px;
    padding: var(--space-3); background: var(--color-white); border: var(--border-width) solid var(--color-gray-200);
    border-radius: var(--radius-md); box-shadow: var(--elevation-dropdown); }
.month-picker__year { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); font-weight: var(--font-weight-semibold); color: var(--color-gray-900); }
.month-picker__year button { border: 0; background: none; width: 28px; height: 28px; border-radius: var(--radius-md); color: var(--color-gray-700); cursor: pointer; }
.month-picker__year button:hover:not(:disabled) { background: var(--color-gray-100); }
.month-picker__year button:disabled { color: var(--color-gray-300); cursor: default; }
.month-picker__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-1); }
.month-picker__grid button { height: 32px; border: var(--border-width) solid transparent; border-radius: var(--radius-md);
    background: none; color: var(--color-gray-900); cursor: pointer; font-size: var(--font-size-body); }

    tempSummerFree: [26.8, 26.6, 26.5, 26.4, 26.3, 26.3, 26.4, 26.7, 27, 27.3, 27.6, 27.8, 28, 28.1, 28.1, 28, 27.9, 27.7, 27.5, 27.3, 27.1, 27, 26.9, 26.8],
    co2Work: [430, 425, 420, 420, 420, 425, 450, 560, 780, 920, 980, 1010, 880, 860, 950, 990, 940, 720, 560, 500, 470, 450, 440, 435],
    co2Free: [430, 428, 425, 424, 424, 424, 425, 428, 432, 438, 440, 442, 442, 440, 438, 436, 435, 434, 433, 432, 432, 431, 431, 430]
};

function readingFor(quantityKey, meter, month, isWorkday, hour, random) {
    const noise = 0.85 + random() * 0.3;
    const heating = HEATING[month - 1];
    switch (quantityKey) {
        case 'water':
            return (isWorkday ? SHAPES.waterWork : SHAPES.waterFree)[hour] * meter.scale * noise;
        case 'electricity': {
            const cooling = isWorkday && hour >= 8 && hour < 18 ? 1 + 0.3 * (1 - heating) : 1;
            return (isWorkday ? SHAPES.powerWork : SHAPES.powerFree)[hour] * meter.scale * cooling * noise;
        }
        case 'heat':
        case 'gas': {
            const hotWater = isWorkday && hour >= 6 && hour < 18 ? 8 : 3;
            const heat = ((isWorkday ? SHAPES.heatWork : SHAPES.heatFree)[hour] * heating + hotWater) * meter.scale * noise;
            return quantityKey === 'gas' ? heat / 9.5 : heat;
        }
        case 'temperature-in': {
            const winter = (isWorkday ? SHAPES.tempWinterWork : SHAPES.tempWinterFree)[hour];
            const summer = (isWorkday ? SHAPES.tempSummerWork : SHAPES.tempSummerFree)[hour];
            return heating * winter + (1 - heating) * summer + meter.scale + (random() - 0.5) * 0.5;
        }
        case 'pressure-water':
            return 3.6 - (isWorkday ? SHAPES.waterWork : SHAPES.waterFree)[hour] * 0.15 + (random() - 0.5) * 0.1;
        case 'weather': {
            const base = heating * 4 + (1 - heating) * 24;
            return base + 5 * Math.sin(((hour - 9) / 24) * 2 * Math.PI) + (random() - 0.5) * 2;
        }
        case 'co2-in': {
            const shape = (isWorkday ? SHAPES.co2Work : SHAPES.co2Free)[hour];
            return 420 + (shape - 420) * meter.scale * noise;
        }
    }
}

const rawCache = new Map();

// One month of hourly readings. A gap of four hours sits on one working day of every
// finished month, and the current month stops at the prototype's clock.
function rawMonth(quantityKey, meter, index) {
    const key = `${quantityKey}|${meter.id}|${index}`;
    if (rawCache.has(key)) return rawCache.get(key);
    const { year, month } = fromIndex(index);
    const random = randomFrom(key);
    const dayCount = daysInMonth(year, month);
    const isCurrent = index === NOW_INDEX;
    const gapStart = 8 + Math.floor(random() * 12);
    let gapDay = null;
    const days = [];
    for (let day = 1; day <= dayCount; day++) {
        const weekday = weekdayOf(year, month, day);
        const isWorkday = weekday < 5 && !isHoliday(year, month, day);
        if (!isCurrent && gapDay === null && day >= gapStart && isWorkday) gapDay = day;
        const hours = [];
        for (let hour = 0; hour < 24; hour++) {
            const isFuture = isCurrent && (day > NOW.day || (day === NOW.day && hour >= NOW.hour));
            const inGap = day === gapDay && hour >= 13 && hour <= 16;
            let value = isFuture || inGap ? null : readingFor(quantityKey, meter, month, isWorkday, hour, random);
            // A leak-like night on the main water meter, the kind of thing the table should make obvious.
            if (meter.id === 'w1' && index === monthIndex(2026, 9) && day === 17 && hour < 5) value = 1.1 + random() * 0.3;
            hours.push({ value, isFuture });
        }
        days.push({ day, weekday, isWeekend: weekday >= 5, hours });
    }
    const result = { year, month, index, days, gapDay };
    rawCache.set(key, result);
    return result;
}

// Fills missing hours on a straight line between the readings around them.
// Hours after the last reading stay empty.
function interpolate(days) {
    const flat = days.flatMap((d) => d.hours.map((h) => ({ ...h })));
    let lastKnown = -1;
    flat.forEach((cell, i) => {
        if (cell.value === null) return;
        if (lastKnown >= 0 && i - lastKnown > 1) {
            const from = flat[lastKnown].value;
            for (let j = lastKnown + 1; j < i; j++) {
                flat[j].value = from + ((cell.value - from) * (j - lastKnown)) / (i - lastKnown);
            }
        }
        lastKnown = i;
    });
    return days.map((d, di) => ({ ...d, hours: flat.slice(di * 24, di * 24 + 24) }));
}

/* ---------- What the backend would return for one month ---------- */

// A profile's level is ordered from low to high, so its shade runs from light to dark grey.
const PROFILE_SHADES = { low: 'var(--profile-low)', mid: 'var(--profile-mid)', high: 'var(--profile-high)' };
// Josip's number: profiles need 22 % of the month's hours read, about 7 days.
const PROFILE_MIN_COVERAGE = 0.22;

// Splits the 24 hourly averages into up to four runs of consecutive hours, each run as
// even as possible. Stands in for the backend's profile algorithm.
function findProfiles(averages, kind) {
    const n = averages.length;
    const groups = Math.min(4, n);
    const cost = (a, b) => {
        const part = averages.slice(a, b);
        const mean = part.reduce((s, v) => s + v, 0) / part.length;
        return part.reduce((s, v) => s + (v - mean) ** 2, 0);
    };
    const best = Array.from({ length: groups + 1 }, () => Array(n + 1).fill(Infinity));
    const cut = Array.from({ length: groups + 1 }, () => Array(n + 1).fill(0));
    best[0][0] = 0;
    for (let k = 1; k <= groups; k++) {
        for (let end = k; end <= n; end++) {
            for (let start = k - 1; start < end; start++) {
                const total = best[k - 1][start] + cost(start, end);
                if (total < best[k][end]) { best[k][end] = total; cut[k][end] = start; }
            }
        }
    }
    const ranges = [];
    let end = n;
    for (let k = groups; k >= 1; k--) { const start = cut[k][end]; ranges.unshift([start, end]); end = start; }
    const low = Math.min(...averages);
    const high = Math.max(...averages);
    const words = kind === 'consumption'
        ? { low: 'niska potrošnja', high: 'visoka potrošnja', mid: 'prijelazno razdoblje' }
        : { low: 'niske vrijednosti', high: 'visoke vrijednosti', mid: 'prijelazno razdoblje' };
    return ranges.map(([from, to], i) => {
        const part = averages.slice(from, to);
        const mean = part.reduce((s, v) => s + v, 0) / part.length;
        const share = high === low ? 0.5 : (mean - low) / (high - low);
        const levelKey = share < 0.33 ? 'low' : share > 0.66 ? 'high' : 'mid';
        return { name: String.fromCharCode(65 + i), from, to, level: words[levelKey], mean, tint: PROFILE_SHADES[levelKey] };
    });
}

function buildMonth(quantityKey, meter, index, withInterpolation) {
    const quantity = QUANTITIES[quantityKey];
    const raw = rawMonth(quantityKey, meter, index);
    const days = withInterpolation ? interpolate(raw.days) : raw.days;
    // Interpolated hours count as read, because interpolation exists so the user does not see the gap.
    let max = null, min = null, measured = 0;
    days.forEach((d) => d.hours.forEach((h, hour) => {
        if (h.value === null) return;
        measured++;
        if (!max || h.value > max.value) max = { value: h.value, day: d.day, hour };
        if (!min || h.value < min.value) min = { value: h.value, day: d.day, hour };
    }));
    const hourlyAverages = Array.from({ length: 24 }, (_, hour) => {
        const values = days.map((d) => d.hours[hour].value).filter((v) => v !== null);
        return values.length ? values.reduce((s, v) => s + v, 0) / values.length : null;
    });
    const dayValues = days.map((d) => {
        const values = d.hours.map((h) => h.value).filter((v) => v !== null);
        if (!values.length) return null;
        const sum = values.reduce((s, v) => s + v, 0);
        return quantity.kind === 'consumption' ? sum : sum / values.length;
    });
    const knownDays = dayValues.filter((v) => v !== null);
    const dailyAverage = knownDays.length ? knownDays.reduce((s, v) => s + v, 0) / knownDays.length : null;
    // The whole month: a sum for consumption, the mean of every reading otherwise.
    const readings = days.flatMap((d) => d.hours.map((h) => h.value)).filter((v) => v !== null);
    const readingsSum = readings.reduce((s, v) => s + v, 0);
    const monthTotal = !readings.length ? null : quantity.kind === 'consumption' ? readingsSum : readingsSum / readings.length;
    const coverage = measured / (days.length * 24);
    const daysWithData = days.filter((d) => d.hours.some((h) => h.value !== null && !h.isFuture)).length;
    const canProfile = coverage >= PROFILE_MIN_COVERAGE && hourlyAverages.every((v) => v !== null);
    return {
        index, title: monthLabel(index), quantityKey, quantity, meter, days, max, min,
        hourlyAverages, dayValues, dailyAverage, monthTotal, coverage, daysWithData, gapDay: raw.gapDay,
        isCurrent: index === NOW_INDEX,
        profiles: canProfile ? findProfiles(hourlyAverages, quantity.kind) : null
    };
}

/* ---------- Formatting and colour ---------- */

const numberFormats = new Map();
function formatNumber(value, decimals) {
    if (!numberFormats.has(decimals)) {
        numberFormats.set(decimals, new Intl.NumberFormat('hr-HR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }));
    }
    return numberFormats.get(decimals).format(value);
}
function decimalsFor(month) {
    if (month.quantity.kind === 'average') return month.quantity.unit === 'ppm' ? 0 : 1;
    const top = month.max ? month.max.value : 0;
    return top < 10 ? 2 : top < 100 ? 1 : 0;
}

const HEAT_STOPS = [[0x63, 0xbe, 0x7b], [0xff, 0xeb, 0x84], [0xf8, 0x69, 0x6b]];
function heatColor(share) {
    const t = Math.max(0, Math.min(1, share)) * 2;
    const i = t >= 1 ? 1 : 0;
    const f = t - i;
    const rgb = [0, 1, 2].map((k) => Math.round(HEAT_STOPS[i][k] + (HEAT_STOPS[i + 1][k] - HEAT_STOPS[i][k]) * f));
    return `rgb(${rgb.join(',')})`;
}

const MeterSelect = {
    props: { groups: Object, modelValue: String, id: String, invalid: Boolean },
    emits: ['update:modelValue'],
    setup(props, { emit }) {
        const open = ref(false);
        const query = ref('');
        const active = ref(0);
        const root = ref(null);
        const meters = computed(() => Object.entries(props.groups).flatMap(([group, list]) => list.map((m) => ({ ...m, group }))));
        const selected = computed(() => meters.value.find((m) => m.id === props.modelValue) || null);
        const label = (m) => m.label;
        const matches = computed(() => {
            const search = normalizeForSearch(query.value.trim());
            return meters.value.filter((m) => !search || normalizeForSearch(label(m)).includes(search));
        });
        // The matches grouped again, each keeping its place in the flat list for the arrow keys.
        const shownGroups = computed(() => {
            const groups = [];
            matches.value.forEach((meter, index) => {
                let group = groups.find((g) => g.title === meter.group);
                if (!group) { group = { title: meter.group, items: [] }; groups.push(group); }
                group.items.push({ meter, index });
            });
            return groups;
        });
        const inputText = computed(() => (open.value ? query.value : selected.value ? label(selected.value) : ''));
        const placeholder = computed(() => (selected.value ? label(selected.value) : 'Odaberite uređaj'));

        function openList() {
            if (open.value) return;
            open.value = true;
            query.value = '';
            active.value = Math.max(0, matches.value.findIndex((m) => m.id === props.modelValue));
        }
        function pick(meter) {
            emit('update:modelValue', meter.id);
            open.value = false;
        }
        function onInput(event) {
            query.value = event.target.value;
            open.value = true;
            active.value = 0;
        }
        function moveActive(step) {
            openList();
            active.value = Math.min(matches.value.length - 1, Math.max(0, active.value + step));
            nextTick(() => { const item = root.value && root.value.querySelector('.dropdown-item.is-active'); if (item) item.scrollIntoView({ block: 'nearest' }); });
        }
        function onKey(event) {
            if (event.key === 'ArrowDown') { event.preventDefault(); moveActive(1); }
            if (event.key === 'ArrowUp') { event.preventDefault(); moveActive(-1); }
            if (event.key === 'Enter' && open.value) { event.preventDefault(); if (matches.value[active.value]) pick(matches.value[active.value]); }
            if (event.key === 'Escape' || event.key === 'Tab') open.value = false;
        }
        const onOutside = (e) => { if (root.value && !root.value.contains(e.target)) open.value = false; };
        onMounted(() => document.addEventListener('mousedown', onOutside));
        onBeforeUnmount(() => document.removeEventListener('mousedown', onOutside));
        return { open, query, active, root, matches, shownGroups, inputText, placeholder, openList, pick, onInput, onKey };
    },
    template: `<div class="meter-select" ref="root">
        <input :id="id" type="text" class="form-control meter-select__input" :class="{ 'is-invalid': invalid }" role="combobox" autocomplete="off"
            :aria-expanded="open" :placeholder="placeholder" :value="inputText" @focus="openList" @click="openList" @input="onInput" @keydown="onKey">
        <i class="fa fa-caret-down meter-select__caret"></i>
        <div v-if="open" class="dropdown-menu show meter-select__menu" role="listbox">
            <template v-for="group in shownGroups" :key="group.title">
                <h6 class="dropdown-header">{{ group.title }}</h6>
                <button v-for="item in group.items" :key="item.meter.id" type="button" class="dropdown-item" role="option"
                    :class="{ 'is-active': item.index === active, 'is-selected': item.meter.id === modelValue }"
                    :aria-selected="item.meter.id === modelValue" @mousedown.prevent="pick(item.meter)">{{ item.meter.label }}</button>
            </template>
            <p v-if="!matches.length" class="meter-select__empty">Nijedan uređaj ne odgovara upisanom tekstu.</p>
        </div></div>`
};

const MonthCard = {
    props: { month: Object, showProfiles: Boolean, range: Object },
    components: { ToggleSwitch },
    emits: ['toggle-profiles', 'update:range', 'show-image'],
    setup(props, { emit }) {
        const root = ref(null);
        const isExporting = ref(false);
        // Draws this table alone on an offscreen sheet and downloads it as a PNG.
        async function exportImage() {
            isExporting.value = true;
            const sheet = document.createElement('div');
            sheet.className = 'export-sheet';
            sheet.appendChild(root.value.cloneNode(true));
            document.body.appendChild(sheet);
            try {
                const src = await modernScreenshot.domToPng(sheet, { scale: 2, backgroundColor: '#ffffff' });
                const fileName = 'tablicni-prikaz-' + props.month.title.toLowerCase().replace(/ /g, '-') + '.png';
                if (CAN_DOWNLOAD) {
                    const link = document.createElement('a');
                    link.href = src;
                    link.download = fileName;
                    link.click();
                } else {
                    emit('show-image', { title: props.month.title, src });
                }
            } finally {
                sheet.remove();
                isExporting.value = false;
            }
        }
        const decimals = computed(() => decimalsFor(props.month));
        const totalDecimals = computed(() => (props.month.quantity.kind === 'consumption' ? (decimals.value > 1 ? 1 : 0) : decimals.value));
        const unit = computed(() => props.month.quantity.unit);
        const isConsumption = computed(() => props.month.quantity.kind === 'consumption');
        const fmt = (v) => (v === null ? '' : formatNumber(v, decimals.value));
        const fmtTotal = (v) => (v === null ? '' : formatNumber(v, totalDecimals.value));
        const profiles = computed(() => (props.showProfiles ? props.month.profiles : null));
        const profileOf = (hour) => (profiles.value ? profiles.value.find((p) => hour >= p.from && hour < p.to) : null);
        // The darkest text keeps the hour labels and averages readable on the darkest grey.
        const profileShade = (hour) => { const p = profileOf(hour); return p ? { backgroundColor: p.tint, color: 'var(--color-gray-900)' } : null; };
        const monthNumber = computed(() => fromIndex(props.month.index).month);
        const columnCount = computed(() => props.month.days.length + 3 + (profiles.value ? 1 : 0));

        // The colour scale runs between the two values the user set, or between the month's min and max.
        // Values below the low end are fully green, values above the high end fully red.
        const scale = computed(() => props.range || (props.month.min ? { low: props.month.min.value, high: props.month.max.value } : null));
        const colorOf = (v) => {
            const span = scale.value.high - scale.value.low;
            return heatColor(span > 0 ? (v - scale.value.low) / span : 0.5);
        };
        const isMax = (d, hour) => props.month.max && props.month.max.day === d.day && props.month.max.hour === hour;
        const isMin = (d, hour) => props.month.min && props.month.min.day === d.day && props.month.min.hour === hour;
        function cellClass(d, hour) {
            return { cell: true, nodata: d.hours[hour].value === null, max: isMax(d, hour), min: isMin(d, hour) };
        }
        function cellStyle(d, hour) {
            const v = d.hours[hour].value;
            return v === null ? null : { backgroundColor: colorOf(v) };
        }

        // The slider runs from 0 for consumption, or from the month's lowest value otherwise, up to the month's highest value.
        // The text fields take any value, and a handle past the slider's end stays at the end.
        const step = computed(() => 10 ** -decimals.value);
        const bounds = computed(() => {
            const { min, max } = props.month;
            return min ? { low: isConsumption.value ? Math.min(0, min.value) : min.value, high: max.value } : null;
        });
        const sliderValue = (v) => Math.min(bounds.value.high, Math.max(bounds.value.low, v));
        const sliderPercent = (v) => {
            const span = bounds.value.high - bounds.value.low;
            return span > 0 ? ((sliderValue(v) - bounds.value.low) / span) * 100 : 0;
        };
        const trackStyle = computed(() => {
            const low = sliderPercent(scale.value.low);
            const high = sliderPercent(scale.value.high);
            return { background: `linear-gradient(90deg, var(--heat-low) 0%, var(--heat-low) ${low}%, var(--heat-mid) ${(low + high) / 2}%, var(--heat-high) ${high}%, var(--heat-high) 100%)` };
        });
        const hasCustomRange = computed(() => !!props.range);
        function setLow(value) {
            const high = scale.value.high;
            emit('update:range', { low: Math.min(value, high - step.value), high });
        }
        function setHigh(value) {
            const low = scale.value.low;
            emit('update:range', { low, high: Math.max(value, low + step.value) });
        }
        // Accepts "2", "2,5" and "1.234,5", the way Croatian numbers are typed.
        function parseTyped(text) {
            const clean = text.trim().includes(',') ? text.trim().replace(/\./g, '').replace(',', '.') : text.trim();
            const value = Number(clean);
            return clean !== '' && Number.isFinite(value) ? value : null;
        }
        function onTyped(end, event) {
            const value = parseTyped(event.target.value);
            if (value !== null) (end === 'low' ? setLow : setHigh)(value);
            nextTick(() => { event.target.value = fmt(scale.value[end]); });
        }
        const resetRange = () => emit('update:range', null);

        // Where the max or min cell sits, in the words of the column and row headers.
        const extremePlace = (extreme) => {
            const d = props.month.days[extreme.day - 1];
            return `${WEEKDAYS[d.weekday]} ${pad(extreme.day)}.${pad(monthNumber.value)}., ${hourLabel(extreme.hour)} h`;
        };
        return { root, isExporting, exportImage, fmt, fmtTotal, unit, isConsumption, profiles, profileOf, profileShade, columnCount, scale, colorOf, extremePlace,
            cellClass, cellStyle, step, bounds, sliderValue, sliderPercent, trackStyle, hasCustomRange, setLow, setHigh, onTyped, resetRange,
            hourLabel, meterName, pad, HOURS, WEEKDAYS, Math };
    },
    template: `<div class="ibox month-card" ref="root">
        <div class="ibox-title">
            <div class="month-card__titles">
                <h5>{{ month.title }} <span class="month-card__meter">{{ meterName(month.meter) }} ({{ unit }})</span></h5>
                <span class="month-card__total">{{ isConsumption ? 'Ukupno' : 'Prosječno očitanje' }}: <strong>{{ month.monthTotal === null ? '-/-' : fmt(month.monthTotal) + ' ' + unit }}</strong></span>
            </div>
            <button type="button" class="btn btn--secondary month-card__export" :disabled="isExporting" @click="exportImage">
                <i :class="isExporting ? 'fa fa-spinner fa-spin' : 'fa fa-download'"></i> Preuzmi kao sliku</button>
        </div>
        <div class="ibox-content">
            <div v-if="month.coverage < 0.97" class="alert alert-warning coverage-alert" role="status">
                <i class="fa fa-exclamation-triangle"></i>
                <div>
                    Očitanja postoje za {{ month.daysWithData }} od {{ month.days.length }} dana, pa prosjeci vrijede samo za te dane.
                    <template v-if="showProfiles && !month.profiles">Za dnevne profile potrebno je barem 22 % očitanja u mjesecu, a sada ih je {{ Math.floor(month.coverage * 100) }} %.</template>
                </div>
            </div>
            <div class="heat-scroll">
                <table class="heat">
                    <colgroup>
                        <col v-if="profiles" class="c-profile">
                        <col class="c-hour">
                        <col class="c-avg">
                        <col v-for="d in month.days" :key="'c' + d.day">
                        <col class="c-hour">
                    </colgroup>
                    <thead>
                        <tr>
                            <th v-if="profiles"></th>
                            <th class="hour hour-l">Sat</th>
                            <th class="avg">Ø</th>
                            <th v-for="d in month.days" :key="'h' + d.day" :class="{ weekend: d.isWeekend }"><span class="wd">{{ WEEKDAYS[d.weekday] }}</span>{{ pad(d.day) }}</th>
                            <th class="hour hour-r">Sat</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="hour in HOURS" :key="hour">
                            <td v-if="profiles && profileOf(hour).from === hour" class="profile"
                                :rowspan="profileOf(hour).to - profileOf(hour).from" :style="profileShade(hour)">{{ profileOf(hour).name }}</td>
                            <th class="hour hour-l" :style="profileShade(hour)">{{ hourLabel(hour) }}</th>
                            <td class="avg" :style="profileShade(hour)">{{ fmt(month.hourlyAverages[hour]) }}</td>
                            <td v-for="d in month.days" :key="d.day" :class="cellClass(d, hour)" :style="cellStyle(d, hour)"
                                :data-gap="d.day === month.gapDay && hour === 13 ? 'true' : null">{{ fmt(d.hours[hour].value) }}</td>
                            <th class="hour hour-r" :style="profileShade(hour)">{{ hourLabel(hour) }}</th>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th v-if="profiles"></th>
                            <th class="hour hour-l">{{ isConsumption ? '∑' : 'Ø' }}</th>
                            <td class="month-total">{{ fmtTotal(month.dailyAverage) }}</td>
                            <td v-for="(d, i) in month.days" :key="'s' + d.day" :class="{ weekend: d.isWeekend }">{{ fmtTotal(month.dayValues[i]) }}</td>
                            <th class="hour hour-r">{{ isConsumption ? '∑' : 'Ø' }}</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="heat-legend">
                <span class="legend-switches">
                    <label class="legend-switch" :for="'profiles-' + month.index">
                        <toggle-switch :id="'profiles-' + month.index" :model-value="showProfiles" aria-label="Dnevni profili"
                            @update:model-value="$emit('toggle-profiles', $event)"></toggle-switch> Dnevni profili
                    </label>
                </span>
                <span v-if="scale" class="range-control">
                    <span class="range-control__label">Raspon boja</span>
                    <input type="text" inputmode="decimal" class="range-input" :value="fmt(scale.low)" aria-label="Donja granica raspona boja"
                        @change="onTyped('low', $event)" @keydown.enter="$event.target.blur()">
                    <span class="range-slider">
                        <i class="range-slider__track" :style="trackStyle"></i>
                        <input type="range" :min="bounds.low" :max="bounds.high" :step="step" :value="sliderValue(scale.low)" aria-label="Donja granica raspona boja"
                            :style="{ zIndex: sliderPercent(scale.low) > 90 ? 3 : 1 }" @input="setLow(Number($event.target.value))">
                        <input type="range" :min="bounds.low" :max="bounds.high" :step="step" :value="sliderValue(scale.high)" aria-label="Gornja granica raspona boja"
                            style="z-index: 2" @input="setHigh(Number($event.target.value))">
                    </span>
                    <input type="text" inputmode="decimal" class="range-input" :value="fmt(scale.high)" aria-label="Gornja granica raspona boja"
                        @change="onTyped('high', $event)" @keydown.enter="$event.target.blur()">
                    <span>{{ unit }}</span>
                    <button v-if="hasCustomRange" type="button" class="range-reset" @click="resetRange">Vrati na min i max</button>
                </span>
                <span v-if="scale" class="scale-static">{{ fmt(scale.low) }} <i class="scale"></i> {{ fmt(scale.high) + ' ' + unit }}</span>
                <span v-if="month.max"><i class="swatch swatch--mark" :style="{ backgroundColor: colorOf(month.max.value) }"></i> Najveća: {{ fmt(month.max.value) }} {{ unit }}, {{ extremePlace(month.max) }}</span>
                <span v-if="month.min"><i class="swatch swatch--mark" :style="{ backgroundColor: colorOf(month.min.value) }"></i> Najmanja: {{ fmt(month.min.value) }} {{ unit }}, {{ extremePlace(month.min) }}</span>
            </div>
            <div v-if="profiles" class="profile-legend">
                <span class="profile-legend__title">Dnevni profili</span>
                <span v-for="p in profiles" :key="p.name" class="profile-legend__item">
                    <i class="profile-legend__swatch" :style="{ backgroundColor: p.tint }">{{ p.name }}</i>
                    <span><b>{{ p.to - p.from === 1 ? hourLabel(p.from) : hourLabel(p.from) + '-' + hourLabel(p.to - 1) }} h</b>, {{ p.level }}</span>
                </span>
            </div>
        </div>
    </div>`
};

/* ---------- Layout data ---------- */

const SIDEBAR = [
    { label: 'Kontrolna ploča', icon: 'fa fa-th-large' },
    { label: 'Voda', icon: 'fa fa-tint', quantity: 'water' },
    { label: 'Električna energija', icon: 'fa fa-bolt', quantity: 'electricity' },
    { label: 'Toplina', icon: 'fa fa-fire-alt', quantity: 'heat' },
    { label: 'Plin', icon: 'fa fa-burn', quantity: 'gas' },

    { label: 'Para', icon: 'fa fa-stream' },
    { label: 'Elementi ugode', icon: 'emasys-icon icon-elements-of-comfort', children: [
        { label: 'Temperatura', icon: 'emasys-icon icon-temperature-in', quantity: 'temperature-in' },

const SCREENS = [
    { id: 'SCR-01', name: 'Prazna stranica', hint: 'Dolazak iz izbornika, još nema tablice' },
    { id: 'SCR-02', name: 'Jedan mjesec', hint: 'Tablica sa svim dodacima iz zadatka' },

/* ---------- App ---------- */

createApp({
    components: { ToggleSwitch, MonthPicker, MonthCard, MeterSelect },
    setup() {
        const state = reactive({
            quantity: 'water',
            meterId: '',
            firstMonth: NOW_INDEX,
            count: 1,
            interpolation: false,
            profiles: false,
            ranges: {},
            showError: false,
            loading: false,
            drawn: null,
            openGroup: null,
            exportImage: null,
            navOpen: window.innerWidth > 700
        });
        const toast = ref(null);
        let toastTimer = null;
        let loadTimer = null;

        const quantity = computed(() => QUANTITIES[state.quantity]);
        // Grouped as legacy groups them: by energy source, then virtual meters, then forecast cities.
        // Each entry reads as the meter's full name and its unit.
        const meterGroups = computed(() => {
            const groups = {};
            quantity.value.meters.forEach((m) => {
                const own = QUANTITIES[quantityKeyOf(m, state.quantity)];
                const group = m.group || own.title;
                (groups[group] = groups[group] || []).push({ id: m.id, label: `${meterName(m)} (${own.unit})` });
            });
            return groups;
        });
        const maxCount = computed(() => Math.min(12, NOW_INDEX - state.firstMonth + 1));
        const months = computed(() => {
            const d = state.drawn;
            if (!d) return [];
            const q = QUANTITIES[d.quantity];
            const meter = q.meters.find((m) => m.id === d.meterId);
            return Array.from({ length: d.count }, (_, i) => buildMonth(quantityKeyOf(meter, d.quantity), meter, d.firstMonth + i, d.interpolation));
        });
        const currentScreen = computed(() => {
            if (state.exportImage) return 'SCR-07';
            if (!state.drawn) return 'SCR-01';
            if (Object.keys(state.ranges).length) return 'SCR-08';
            if (months.value[0].quantity.kind === 'average') return 'SCR-06';
            if (state.drawn.count > 1) return 'SCR-04';
            if (state.drawn.interpolation) return 'SCR-05';
            if (state.profiles) return 'SCR-03';
            return 'SCR-02';
        });

        function setFirstMonth(index) {
            state.firstMonth = index;
            if (state.count > maxCount.value) state.count = maxCount.value;
        }
        function selectQuantity(key) {
            state.quantity = key;
            state.meterId = '';
            state.drawn = null;
            state.showError = false;
            window.scrollTo({ top: 0 });
        }
        function draw() {
            if (!state.meterId) { state.showError = true; return Promise.resolve(); }
            state.showError = false;
            state.loading = true;
            clearTimeout(loadTimer);
            return new Promise((resolve) => {
                loadTimer = setTimeout(() => {
                    state.drawn = { quantity: state.quantity, meterId: state.meterId, firstMonth: state.firstMonth, count: state.count, interpolation: state.interpolation };
                    state.ranges = {};
                    state.loading = false;
                    nextTick(resolve);
                }, 450);
            });
        }
        function showToast(text) {
            toast.value = text;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.value = null; }, 4200);
        }
        // Exports what is drawn on the screen, not what the fields say now.
        function exportExcel() {
            const d = state.drawn;
            if (!d) return;
            const meter = QUANTITIES[d.quantity].meters.find((m) => m.id === d.meterId);
            const last = d.firstMonth + d.count - 1;
            const range = d.count === 1 ? monthLabel(d.firstMonth) : `${monthLabel(d.firstMonth)} do ${monthLabel(last)}`;
            showToast(`Excel za ${meterName(meter)}, ${range}, radi server kao i danas. U prototipu se datoteka ne preuzima.`);
        }
        // Only the private artifact copy shows the picture, because its viewer blocks downloads.
        function showImage(image) { state.exportImage = image; }
        function closeExport() { state.exportImage = null; }

        async function jump(id) {
            closeExport();
            const preset = { quantity: 'water', meterId: 'w1', firstMonth: monthIndex(2026, 9), count: 1, interpolation: false, profiles: false };
            if (id === 'SCR-03') preset.profiles = true;
            if (id === 'SCR-07') Object.assign(preset, { firstMonth: monthIndex(2026, 8), count: 2, profiles: true });
            if (id === 'SCR-04') Object.assign(preset, { firstMonth: monthIndex(2026, 8), count: 3, profiles: true });
            if (id === 'SCR-05') preset.interpolation = true;
            if (id === 'SCR-06') Object.assign(preset, { quantity: 'temperature-in', meterId: 't1' });
            state.openGroup = id === 'SCR-06' ? 'Elementi ugode' : null;
            Object.assign(state, preset, { showError: false });
            if (id === 'SCR-01') { state.meterId = ''; state.drawn = null; window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
            await draw();
            if (id === 'SCR-05') {
                const gap = document.querySelector('td[data-gap]');
                if (gap) {
                    gap.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
                }
                return;
            }
            const firstCard = document.querySelector('.month-card');
            if (firstCard) window.scrollTo({ top: firstCard.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
            if (id === 'SCR-07') {
                const exportButton = document.querySelector('.month-card__export');
                if (exportButton) exportButton.focus();
            }
            if (id === 'SCR-08') state.ranges = { [monthIndex(2026, 9)]: { low: 0, high: 2 } };
        }

        function sidebarClick(item) {
            if (item.quantity) { selectQuantity(item.quantity); return; }
            if (item.children) { state.openGroup = state.openGroup === item.label ? null : item.label; return; }
            showToast(`"${item.label}" nije dio ovog prototipa.`);
        }
        const isActive = (item) => item.quantity === state.quantity || (item.children || []).some((c) => c.quantity === state.quantity);

        return { state, quantity, meterGroups, maxCount, months, currentScreen, toast, SIDEBAR, SCREENS, CAN_DOWNLOAD,
            setFirstMonth, draw, exportExcel, showImage, closeExport, jump, sidebarClick, isActive, showToast };
    },
    template: `
    <div id="wrapper">
        <nav class="navbar-default navbar-static-side" role="navigation">
            <div class="sidebar-collapse">

                                    <div class="ibox-content">
                                        <form class="settings-grid" @submit.prevent="draw">
                                            <div class="form-group">
                                                <label for="heatmap-meter" class="font-weight-bold">Uređaj</label>
                                                <meter-select id="heatmap-meter" :groups="meterGroups" :model-value="state.meterId" :invalid="state.showError"

                                            </div>
                                            <div class="form-group">
                                                <label for="heatmap-first-month" class="font-weight-bold">Prvi mjesec</label>

                                            </div>
                                            <div class="form-group">
                                                <label for="heatmap-count" class="font-weight-bold">Broj mjeseci</label>
                                                <select id="heatmap-count" class="form-control" v-model.number="state.count">

                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="heatmap-interpolation" class="font-weight-bold">Interpolacija</label>
                                                <div class="switch-field"><toggle-switch id="heatmap-interpolation" v-model="state.interpolation" aria-label="Interpolacija"></toggle-switch></div>
                                            </div>

                                            </div>
                                        </form>
                                    </div>
                                </div>

                                </div></div>

        <div class="modal__backdrop" @click="closeExport"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="export-title">Slika, {{ state.exportImage.title }}</h4>
                    <button type="button" class="close" aria-label="Zatvori" @click="closeExport"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <img :src="state.exportImage.src" class="export-preview" :alt="'Tablica, ' + state.exportImage.title">
                    <p class="export-note">U aplikaciji gumb odmah preuzima ovu sliku kao PNG datoteku. Pregled u kojem gledate prototip ne dopušta preuzimanje, pa je slika prikazana ovdje.</p>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn--secondary" @click="closeExport">Zatvori</button></div>
            </div>
        </div>
    </div>

    <aside class="proto-nav" aria-label="Ekrani prototipa">
        <button type="button" class="proto-nav__head" @click="state.navOpen = !state.navOpen" :aria-expanded="state.navOpen">
            <i class="fa fa-layer-group"></i><strong>Prototip, ekrani</strong><span class="tag">{{ currentScreen }}</span>
            <i :class="state.navOpen ? 'fa fa-chevron-down' : 'fa fa-chevron-up'"></i>
        </button>
        <ol v-if="state.navOpen">
            <li v-for="s in SCREENS" :key="s.id">
                <button type="button" :class="{ 'is-current': s.id === currentScreen }" @click="jump(s.id)">
                    <b>{{ s.id }}</b><span>{{ s.name }}<small>{{ s.hint }}</small></span>
                </button>
            </li>
        </ol>
    </aside>`
}).mount('#app');
</script>

</body>
</html>
